[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Coverage measures production code only. Deploy scripts, integration tests,
# invariant handlers, and mocks are the instruments doing the measuring — their
# own line coverage says nothing about whether src/ is exercised, and an
# unreached test line is already reported by the suite itself.
no_match_coverage = "(script|test)/"

# The tests deploy the real Gnosis ConditionalTokens bytecode through vm.getCode.
# Foundry blocks file reads by default, so this grants read access to the one
# vendored artifact folder and nothing else.
fs_permissions = [{ access = "read", path = "./lib/ctf-exchange/artifacts" }]

# The optimizer is on for contract size, not for gas. See the compiler optimizer
# decision (ADR-9FOM) in
# specs/features/contracts/FEAT-J92H-deploy-contracts/ARCHITECTURE.md.
optimizer = true
optimizer_runs = 200

# forge's own defaults (runs=256, depth=500 -> 128k calls/run) are sized for
# large multi-contract protocols. This vault's invariant handler is a single
# contract with a handful of actions; depth=500 mostly re-exercises the same
# few code paths while checking an O(positions) invariant after every single
# call, which made a single invariant suite take >10 minutes for no added
# coverage. These values keep meaningful randomized coverage while running in
# seconds.
[invariant]
runs = 100
depth = 50

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
